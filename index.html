<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReBuilt Meals — Build Your Order</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <!-- GA4 -- existing ReBuilt Meals property (G-C3MM8Z4V9Y), shared with
         the storefront's own tag. linker.domains lets a client_id carry
         across origins (this app <-> checkout.rebuiltmeals.com) instead of
         Shopify checkout starting a fresh session and losing attribution. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-C3MM8Z4V9Y"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-C3MM8Z4V9Y', {
        linker: {
          domains: ['rebuiltmeals.com', 'checkout.rebuiltmeals.com', 'rebuiltcheckout.netlify.app'],
          accept_incoming: true
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
